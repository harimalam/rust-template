name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Compile `query!` macros from the committed .sqlx metadata (no database needed to build).
  SQLX_OFFLINE: "true"

jobs:
  lint:
    name: Format & clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings

  test:
    name: Tests & coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app_password
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s --health-timeout 3s --health-retries 10
      valkey:
        image: valkey/valkey:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://app:app_password@localhost:5432/app
      VALKEY_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: baptiste0928/cargo-install@v3
        with:
          crate: sqlx-cli
          args: --no-default-features --features rustls,postgres
          locked: true
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Apply migrations
        run: sqlx migrate run
      - name: Offline query metadata is up to date
        run: cargo sqlx prepare --check -- --all-targets
      - name: Test with coverage
        run: cargo llvm-cov --locked --lcov --output-path lcov.info
      - name: Coverage summary
        run: cargo llvm-cov report --summary-only
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: lcov.info

  deny:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: rust-template-app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # To publish, add a registry login step and set `push: true` with a real tag, e.g. on
      # `refs/tags/v*`. Run `app migrate` as a separate release step before rolling out new pods.
