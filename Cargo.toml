[package]
name = "app"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
async-trait = "0.1.92"
aws-sdk-s3 = { version = "1.157.0", default-features = false, features = ["http-1x", "default-https-client", "rt-tokio", "behavior-version-latest"] }
axum = { version = "0.8.9", features = ["macros", "multipart"] }
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
dotenvy = "0.15.7"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["aws_lc_rs"] }
lapin = "4.12.3"
lettre = { version = "0.11.23", default-features = false, features = ["builder", "hostname", "smtp-transport", "tokio1", "tokio1-rustls", "aws-lc-rs", "webpki-roots", "pool"] }
metrics = { version = "0.24.6", default-features = false }
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
rand = "0.10.3"
redis = { version = "1.8.1", features = ["tokio-comp", "connection-manager", "tokio-rustls-comp"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "postgres", "macros", "migrate", "uuid", "chrono", "json"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-cron-scheduler = "0.15.1"
tower = { version = "0.5.3", default-features = false }
tower-http = { version = "0.7.1", default-features = false, features = ["catch-panic", "compression-gzip", "cors", "limit", "propagate-header", "request-id", "set-header", "timeout", "trace", "util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
utoipa = { version = "6.0.0", features = ["uuid", "chrono"] }
utoipa-scalar = { version = "0.4.0", features = ["axum"] }
uuid = { version = "1.29.0", features = ["v7", "serde"] }
validator = { version = "0.21.0", features = ["derive"] }

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }

# Password hashing is far too slow unoptimised; keep debug builds and tests usable.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
