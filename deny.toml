# cargo-deny: https://embarkstudios.github.io/cargo-deny/
[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# This crate is a private template (publish = false); don't demand a license for it.
private = { ignore = true }
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Unicode-3.0", "Unicode-DFS-2016", "Zlib", "CC0-1.0", "MPL-2.0", "OpenSSL",
  "CDLA-Permissive-2.0", "BSL-1.0", "0BSD",
]

[bans]
multiple-versions = "warn"
# We use rustls everywhere; fail the build if OpenSSL sneaks in.
deny = [{ crate = "openssl-sys" }, { crate = "native-tls" }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
