name: rust-template

# Infra only:            docker compose up -d
# Infra + app services:  docker compose --profile app up --build -d
# Values come from `.env` (copy `.env.example`).

x-app: &app
  build:
    context: .
  image: rust-template-app:local
  profiles: ["app"]
  env_file: .env
  environment: &app-env
    # In-network hostnames override the localhost values from .env
    HTTP_HOST: 0.0.0.0
    DATABASE_URL: postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app_password}@postgres:5432/${POSTGRES_DB:-app}
    VALKEY_URL: redis://valkey:6379
    RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-app}:${RABBITMQ_DEFAULT_PASS:-app_password}@rabbitmq:5672/%2f
    SMTP_HOST: mailpit
    SMTP_PORT: "1025"
    S3_ENDPOINT: http://rustfs:9000
    # S3_PUBLIC_ENDPOINT is intentionally taken from .env (host-reachable)
  # The image's HEALTHCHECK probes the HTTP port; only the api serves HTTP.
  healthcheck:
    disable: true
  restart: unless-stopped

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app_password}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      # Postgres 18+ keeps data in a versioned subdirectory; mount the parent.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  valkey:
    image: valkey/valkey:8-alpine
    command: ["valkey-server", "--appendonly", "yes", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:${VALKEY_HOST_PORT:-6380}:6379"
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-app}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-app_password}
    ports:
      - "127.0.0.1:${RABBITMQ_HOST_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_UI_HOST_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  rustfs:
    image: rustfs/rustfs:latest # pin a version tag/digest for production
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin-secret}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
    ports:
      - "127.0.0.1:${RUSTFS_HOST_PORT:-9000}:9000"
      - "127.0.0.1:${RUSTFS_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_HOST_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_HOST_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Application (profile "app") ────────────────────────────────────────────
  migrate:
    <<: *app
    command: ["migrate"]
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }

  api:
    <<: *app
    command: ["serve"]
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:8080"
    environment:
      <<: *app-env
      HTTP_PORT: "8080"
    depends_on:
      migrate: { condition: service_completed_successfully }
      valkey: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      rustfs: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "/app", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    <<: *app
    command: ["worker"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }
      mailpit: { condition: service_healthy }

  scheduler:
    <<: *app
    command: ["scheduler"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      valkey: { condition: service_healthy }

volumes:
  postgres-data:
  valkey-data:
  rabbitmq-data:
  rustfs-data:
